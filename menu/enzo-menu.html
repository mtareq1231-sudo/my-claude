<style>
/* Layout: phone-first single column (max 760px) — crest header band, chapter banner, sticky category tabs, red section bars, item cards; RTL mirror for Arabic */
:root {
  --ketchup: #b3211b; --ketchup-text: #b3211b; --ketchup-deep: #7a1510; --on-ketchup: #fff5e1;
  --mustard: #f4b41a; --on-mustard: #1f1a16; --pickle: #2f6b3a; --on-pickle: #fff5e1;
  --surface-100: #fff5e1; --surface-200: #f6e3bf; --paper: #fffbf2;
  --ink: #1f1a16; --ink-muted: #6b5a4c; --line: #e3cfa8;
  --texas-rust: #b4501a; --focus: #1e5aa8;
  --shadow-sign: 3px 3px 0 #1f1a16;
  --shadow-card: 0 1px 0 #e3cfa8, 0 6px 16px rgba(122, 21, 16, 0.08);
  --font-display: "Alfa Slab One", Rockwell, Georgia, serif;
  --font-condensed: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: Barlow, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-script: Yellowtail, "Brush Script MT", cursive;
  --font-western: Rye, "Alfa Slab One", Georgia, serif;
  --font-ar-display: Lalezar, "Alfa Slab One", sans-serif;
  --font-ar-body: Tajawal, Barlow, system-ui, sans-serif;
  --radius-sm: 4px; --radius-md: 10px; --radius-pill: 999px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ketchup: #c9302a; --ketchup-text: #f06a5c; --ketchup-deep: #6e1612; --mustard: #f6c042;
  --surface-100: #16110e; --surface-200: #221a15; --paper: #2a211b;
  --ink: #fbeedb; --ink-muted: #c2ae97; --line: #4a3a2e; --focus: #7fb0f0;
  --shadow-sign: 3px 3px 0 #000000; --shadow-card: 0 1px 0 #4a3a2e, 0 6px 16px rgba(0, 0, 0, 0.4);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --ketchup: #c9302a; --ketchup-text: #f06a5c; --ketchup-deep: #6e1612; --mustard: #f6c042;
  --surface-100: #16110e; --surface-200: #221a15; --paper: #2a211b;
  --ink: #fbeedb; --ink-muted: #c2ae97; --line: #4a3a2e; --focus: #7fb0f0;
  --shadow-sign: 3px 3px 0 #000000; --shadow-card: 0 1px 0 #4a3a2e, 0 6px 16px rgba(0, 0, 0, 0.4);
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--surface-100); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface-200); }
body.ar { font-family: var(--font-ar-body); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Draft strip */
.draft { background: var(--mustard); color: var(--on-mustard); font-family: var(--font-condensed); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.draft .wrap { padding-block: 6px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; text-align: center; }
body.ar .draft { font-family: var(--font-ar-body); letter-spacing: 0; text-transform: none; }

/* Hero band */
.hero { background: var(--ketchup-deep); color: var(--on-ketchup); position: relative; overflow: hidden; }
.hero .wrap { padding-block: 20px 0; display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.crest { width: 84px; height: auto; display: block; filter: drop-shadow(3px 3px 0 rgba(0,0,0,.35)); }
.topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.eyebrow { font-family: var(--font-condensed); font-weight: 600; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--mustard); }
body.ar .eyebrow { font-family: var(--font-ar-body); letter-spacing: 0; font-size: 14px; }
.hero h1 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 6.5vw, 48px); line-height: 1; letter-spacing: .01em; text-wrap: balance; }
body.ar .hero h1 { font-family: var(--font-ar-display); line-height: 1.25; }
.lang { flex: none; display: inline-flex; border: 2px solid var(--on-ketchup); border-radius: var(--radius-pill); overflow: hidden; }
.lang button { min-width: 44px; min-height: 36px; padding: 0 12px; border: 0; background: transparent; color: var(--on-ketchup); font-family: var(--font-condensed); font-weight: 700; font-size: 15px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--on-ketchup); color: var(--ketchup-deep); }
.lang button.arb { font-family: var(--font-ar-body); font-weight: 800; }
.hero-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-block: 14px 18px; font-family: var(--font-condensed); font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
body.ar .hero-meta { font-family: var(--font-ar-body); letter-spacing: 0; text-transform: none; }
.stars { color: var(--mustard); letter-spacing: .2em; }
.checker { height: 16px; background-color: var(--surface-200); background-image: conic-gradient(var(--ink) 25%, transparent 0 50%, var(--ink) 0 75%, transparent 0); background-size: 16px 16px; }

/* Chapter */
.chapter { margin-top: 20px; display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: var(--radius-md); background: var(--paper); box-shadow: var(--shadow-card); border: 2px solid var(--texas-rust); }
.chapter img { width: 76px; height: 76px; object-fit: cover; border-radius: var(--radius-sm); flex: none; }
.chapter > div { min-width: 0; }
.chapter .k { font-family: var(--font-condensed); font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted); }
.chapter h2 { margin: 0; font-family: var(--font-western); font-weight: 400; font-size: 26px; line-height: 1.15; color: var(--ink); }
.chapter p { margin: 2px 0 0; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
body.ar .chapter .k { font-family: var(--font-ar-body); letter-spacing: 0; font-size: 13px; }
body.ar .chapter p { font-size: 15px; line-height: 24px; }

/* Tabs */
.tabs-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface-200); border-bottom: 2px solid var(--ink); margin-top: 20px; }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-block: 10px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 2px solid var(--ink); border-radius: var(--radius-pill); background: var(--paper); color: var(--ink); font-family: var(--font-condensed); font-weight: 700; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; text-decoration: none; }
.tab svg { width: 20px; height: 20px; flex: none; }
.tab[aria-current="true"] { background: var(--ketchup); color: var(--on-ketchup); box-shadow: var(--shadow-sign); }
body.ar .tab { font-family: var(--font-ar-body); font-weight: 800; letter-spacing: 0; text-transform: none; }

/* Search */
.search { margin-top: 16px; display: flex; align-items: center; gap: 8px; padding: 0 14px; min-height: 48px; background: var(--paper); border: 2px solid var(--ink); border-radius: var(--radius-sm); }
.search svg { width: 20px; height: 20px; flex: none; color: var(--ink-muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16px; padding-block: 10px; outline: none; }
.search input::placeholder { color: var(--ink-muted); }
.search:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.empty { margin-top: 24px; padding: 20px; text-align: center; color: var(--ink-muted); border: 2px dashed var(--line); border-radius: var(--radius-md); }

/* Sections */
main { padding-bottom: 48px; }
.sec { padding-top: 40px; scroll-margin-top: 80px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 16px; background: var(--ketchup); color: var(--on-ketchup); border-radius: var(--radius-sm); box-shadow: 4px 4px 0 var(--ketchup-deep); }
.sec-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.15; letter-spacing: .02em; text-transform: uppercase; }
body.ar .sec-head h2 { font-family: var(--font-ar-display); text-transform: none; letter-spacing: 0; line-height: 1.4; }
.sec-head .kick { font-family: var(--font-condensed); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
body.ar .sec-head .kick { font-family: var(--font-ar-body); letter-spacing: 0; font-size: 14px; }
.sec-head .note { margin-inline-start: auto; display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: var(--radius-pill); background: var(--surface-100); color: var(--ink); font-family: var(--font-condensed); font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
.sec-head .note svg { width: 16px; height: 16px; }
body.ar .sec-head .note { font-family: var(--font-ar-body); letter-spacing: 0; font-size: 14px; }
.aside { margin: 14px 4px 0; font-family: var(--font-script); font-size: 24px; line-height: 1.1; color: var(--ketchup-text); }
body.ar .aside { font-family: var(--font-ar-display); font-size: 20px; line-height: 1.5; }
.banner-img { margin-top: 14px; width: 100%; height: 96px; object-fit: cover; border-radius: var(--radius-md); display: block; }
.items { display: grid; gap: 14px; margin-top: 16px; }

/* Item */
.item { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; padding: 14px 16px; background: var(--paper); border-radius: var(--radius-md); box-shadow: var(--shadow-card); }
.item.photo { grid-template-columns: 104px 1fr auto; }
.item img { grid-row: span 2; width: 104px; height: 104px; object-fit: cover; border-radius: var(--radius-sm); }
.item-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0; }
.item h3 { margin: 0; font-family: var(--font-condensed); font-weight: 700; font-size: 22px; line-height: 26px; letter-spacing: .02em; text-transform: uppercase; }
body.ar .item h3 { font-family: var(--font-ar-body); font-weight: 800; font-size: 20px; line-height: 28px; letter-spacing: 0; text-transform: none; }
.desc { grid-column: 1 / -1; margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted); min-width: 0; }
.item.photo .desc { grid-column: 2 / -1; }
body.ar .desc { font-size: 15px; line-height: 26px; font-weight: 500; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--radius-sm); font-family: var(--font-condensed); font-weight: 600; font-size: 12px; line-height: 16px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
.badge svg { width: 13px; height: 13px; }
body.ar .badge { font-family: var(--font-ar-body); letter-spacing: 0; font-size: 12px; font-weight: 800; }
.b-signature { background: var(--mustard); color: var(--on-mustard); }
.b-spicy { background: var(--ketchup); color: var(--on-ketchup); }
.b-grilled { background: var(--pickle); color: var(--on-pickle); }
.b-tortilla { color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.prices { display: flex; gap: 6px; align-self: start; font-variant-numeric: tabular-nums; }
.chip { display: inline-flex; flex-direction: column; align-items: center; min-width: 52px; padding: 3px 8px; border-radius: var(--radius-sm); background: var(--ketchup); color: var(--on-ketchup); }
.chip.alt { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ketchup); }
.chip .l { font-family: var(--font-condensed); font-weight: 600; font-size: 11px; line-height: 14px; letter-spacing: .1em; text-transform: uppercase; }
body.ar .chip .l { font-family: var(--font-ar-body); letter-spacing: 0; font-size: 12px; }
.chip .n { font-family: var(--font-condensed); font-weight: 700; font-size: 22px; line-height: 24px; }
@media (max-width: 440px) {
  .item.photo { grid-template-columns: 76px 1fr; }
  .item.photo img { width: 76px; height: 76px; }
  .item.photo .prices { grid-column: 2; }
  .item.photo .desc { grid-column: 1 / -1; }
}

/* Fries + extras */
.sizes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
.size { padding: 16px; text-align: center; background: var(--paper); border: 2px solid var(--ketchup); border-radius: var(--radius-md); }
.size .l { font-family: var(--font-condensed); font-weight: 700; font-size: 16px; letter-spacing: .12em; text-transform: uppercase; }
body.ar .size .l { font-family: var(--font-ar-body); letter-spacing: 0; font-weight: 800; }
.size .n { font-family: var(--font-display); font-size: 36px; line-height: 1.1; color: var(--ketchup-text); font-variant-numeric: tabular-nums; }
.sauces { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.sauce { display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: var(--radius-pill); border: 1.5px solid var(--ink); background: var(--paper); font-family: var(--font-condensed); font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
body.ar .sauce { font-family: var(--font-ar-body); letter-spacing: 0; font-weight: 800; }
.sub { margin: 20px 0 0; font-family: var(--font-condensed); font-weight: 700; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted); }
body.ar .sub { font-family: var(--font-ar-body); letter-spacing: 0; }

/* Footer */
footer { background: var(--ketchup-deep); color: var(--on-ketchup); }
footer .wrap { padding-block: 28px 36px; display: grid; gap: 14px; }
footer .big { font-family: var(--font-display); font-size: 26px; line-height: 1.15; }
body.ar footer .big { font-family: var(--font-ar-display); }
.phone { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.phone strong { font-family: var(--font-display); font-weight: 400; font-size: 28px; letter-spacing: .03em; font-variant-numeric: tabular-nums; direction: ltr; user-select: all; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border: 2px solid var(--on-mustard); border-radius: var(--radius-sm); background: var(--mustard); color: var(--on-mustard); font-family: var(--font-condensed); font-weight: 700; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; box-shadow: 3px 3px 0 #000000; cursor: pointer; text-decoration: none; }
.btn:active { transform: translate(3px, 3px); box-shadow: none; }
body.ar .btn { font-family: var(--font-ar-body); letter-spacing: 0; font-weight: 800; }
.foot-meta { display: grid; gap: 4px; font-size: 15px; }
.foot-meta a { color: var(--on-ketchup); }
.fine { font-size: 12px; opacity: .85; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

        { en: "Ranch Buttermilk", ar: "رانش باترميلك", s: 140, d: 220, den: "Chicken, beef bacon, ranch sauce, mayo, pickles & lettuce", dar: "فراخ كرسبي، بيف بيكن، صوص رانش، مايونيز، مخلل وخس" },
        { en: "Spanish Cook", ar: "سبانيش كوك", s: 170, d: 250, b: ["grilled"], den: "Grilled chicken, beef bacon, mozzarella, cheddar, mushrooms, caramelized onions, Texas sauce & mayo", dar: "صدور فراخ مشوية، بيف بيكن، موتزاريلا، شيدر، مشروم، بصل مكرمل، صوص تكساس ومايونيز" },
        { en: "Chicken Melted Cheese", ar: "تشيكن ملتد تشيز", s: 155, d: 235, den: "Chicken, beef bacon, mozzarella, cheddar, thousand island, mayo, lettuce & pickles", dar: "فراخ، بيف بيكن، موتزاريلا، شيدر، صوص ثاوزند أيلاند، مايونيز، خس ومخلل" },
        { en: "Alpha Chicken Wrap", ar: "ألفا تشيكن راب", p: 155, b: ["tortilla"], den: "Chicken, mozzarella, cheddar, Texas sauce, ketchup, mayo, pickles & lettuce", dar: "فراخ ملفوفة مع موتزاريلا، شيدر، صوص تكساس، كاتشب، مايونيز، مخلل وخس" }
      ] },
    { id: "hotdogs", icon: "hotdog", banner: "hotdog",
      title: { en: "Hot Dogs", ar: "هوت دوج" }, kick: { en: "Grilled & loaded", ar: "مشوي ومحشي" },
      items: [
        { en: "Classic Hot Dog", ar: "كلاسيك هوت دوج", p: 70, den: "Hot dog sausage, ketchup, mustard, pickles & lettuce", dar: "سوسيس هوت دوج، كاتشب، مسطردة، مخلل وخس" },
        { en: "Maxi Dog", ar: "ماكسي دوج", p: 85, den: "Hot dog sausage, mozzarella, BBQ sauce, ketchup, black olives, fresh onion, peppers & tomatoes", dar: "سوسيس هوت دوج، موتزاريلا، باربكيو، كاتشب، زيتون أسود، بصل فريش، فلفل وطماطم" },
        { en: "Mix Cheese Hot Dog", ar: "ميكس تشيز هوت دوج", p: 80, den: "Hot dog sausage, mozzarella, cheddar sauce, ketchup, pickles & lettuce", dar: "سوسيس هوت دوج، موتزاريلا، صوص شيدر، كاتشب، مخلل وخس" }
      ] },
    { id: "fries", icon: "fries", kind: "fries",
      title: { en: "French Fries", ar: "بطاطس فرايز" }, kick: { en: "Golden & crispy", ar: "دهبي ومقرمش" },
      aside: { en: "Golden, crispy & salted just right!", ar: "دهبي ومقرمش وملحه مظبوط!" } },
    { id: "meals", icon: "fries", banner: "fries",
      title: { en: "Fries Meals", ar: "وجبات البطاطس" }, kick: { en: "Fries, loaded", ar: "بطاطس محمّلة" },
      items: [
        { en: "Ranch Fries Meal", ar: "رانش فرايز ميل", p: 100, b: ["spicy"], den: "French fries, crispy chicken, ranch sauce & jalapeños", dar: "بطاطس، فراخ كرسبي، صوص رانش وهالبينو" },
        { en: "Cheddar Fries Meal", ar: "شيدر فرايز ميل", p: 100, b: ["spicy"], den: "French fries, crispy chicken, cheddar sauce & jalapeños", dar: "بطاطس، فراخ كرسبي، صوص شيدر وهالبينو" },
        { en: "Fries Hot Dog", ar: "فرايز هوت دوج", p: 80, b: ["spicy"], den: "French fries, hot dog sausage, cheddar sauce & jalapeños", dar: "بطاطس، سوسيس هوت دوج، صوص شيدر وهالبينو" }
      ] },
    { id: "extras", icon: "drink", kind: "extras",
      title: { en: "Add-ons", ar: "إضافات" }, kick: { en: "Make it yours", ar: "زوّد على مزاجك" } }
  ];
  var SAUCES = [["Texas", "تكساس"], ["BBQ", "باربكيو"], ["Ranch", "رانش"], ["Cheddar", "شيدر"], ["Sriracha", "سريراتشا"], ["1000 Island", "ثاوزند أيلاند"], ["Mayo", "مايونيز"]];

  var lang = "en";
  try { var saved = localStorage.getItem("enzo-lang"); if (saved === "ar" || saved === "en") lang = saved; } catch (e) {}
  var hashOnLoad = (location.hash || "").slice(1);

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function priceHTML(it, t) {
    if (it.p != null) return '<div class="prices"><span class="chip"><span class="n">' + it.p + "</span></span></div>";
    return '<div class="prices" aria-label="' + t.single + " " + it.s + ", " + t.double + " " + it.d + '">' +
      '<span class="chip"><span class="l">' + t.single + '</span><span class="n">' + it.s + "</span></span>" +
      '<span class="chip alt"><span class="l">' + t.double + '</span><span class="n">' + it.d + "</span></span></div>";
  }
  function itemHTML(it, t) {
    var badges = (it.b || []).map(function (b) {
      return '<span class="badge b-' + b + '">' + (b === "spicy" ? svg("spicy") : "") + BADGE[b][lang] + "</span>";
    }).join("");
    var name = it[lang];
    var hay = (it.en + " " + it.ar + " " + it.den + " " + it.dar + " " + (it.b || []).join(" ")).toLowerCase();
    return '<article class="item' + (it.img ? " photo" : "") + '" data-hay="' + esc(hay) + '">' +
      (it.img ? '<img src="' + IMG[it.img] + '" alt="' + esc(name) + '" loading="lazy">' : "") +
      '<div class="item-head"><h3>' + esc(name) + "</h3>" + badges + "</div>" +
      priceHTML(it, t) +
      '<p class="desc">' + esc(lang === "ar" ? it.dar : it.den) + "</p></article>";
  }
  function sectionHTML(sec, t) {
    var h = '<section class="sec" id="' + sec.id + '" aria-labelledby="h-' + sec.id + '">' +
      '<div class="sec-head"><h2 id="h-' + sec.id + '">' + sec.title[lang] + "</h2>" +
      '<span class="kick">' + sec.kick[lang] + "</span>" +
      (sec.fries ? '<span class="note">' + svg("fries") + t.withFries + "</span>" : "") + "</div>";
    if (sec.aside) h += '<p class="aside">' + sec.aside[lang] + "</p>";
    if (sec.banner) h += '<img class="banner-img" src="' + IMG[sec.banner] + '" alt="" loading="lazy">';
    if (sec.kind === "fries") {
      h += '<div class="sizes" data-hay="fries french بطاطس فرايز"><div class="size"><div class="l">' + t.medium + '</div><div class="n">25</div></div>' +
        '<div class="size"><div class="l">' + t.large + '</div><div class="n">50</div></div></div>';
    } else if (sec.kind === "extras") {
      h += '<div class="items"><article class="item" data-hay="soda drink مشروب غازي"><div class="item-head"><h3>' + t.soda + "</h3></div>" +
        '<div class="prices"><span class="chip"><span class="n">25</span></span></div></article></div>' +
        '<p class="sub">' + t.sauces + '</p><div class="sauces" data-hay="sauce صوص ' + SAUCES.map(function (s) { return s.join(" ").toLowerCase(); }).join(" ") + '">' +
        SAUCES.map(function (s) { return '<span class="sauce">' + (lang === "ar" ? s[1] : s[0]) + "</span>"; }).join("") + "</div>";
    } else {
      h += '<div class="items">' + sec.items.map(function (it) { return itemHTML(it, t); }).join("") + "</div>";
    }
    return h + "</section>";
  }

  function render() {
    var t = T[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.body.classList.toggle("ar", lang === "ar");
    ["en", "ar"].forEach(function (l) { document.getElementById("lang-" + l).setAttribute("aria-pressed", l === lang ? "true" : "false"); });
    document.getElementById("draft").textContent = t.draft;
    document.getElementById("t-eyebrow").textContent = t.eyebrow;
    document.getElementById("t-tagline").textContent = t.tagline;
    document.getElementById("t-meta").innerHTML = t.meta;
    document.getElementById("t-journey").textContent = t.journey;
    document.getElementById("t-chapter").textContent = t.chapter;
    document.getElementById("t-story").textContent = t.story;
    document.getElementById("q").placeholder = t.search;
    document.getElementById("q").setAttribute("aria-label", t.search);
    document.getElementById("empty").textContent = t.empty;
    document.getElementById("t-hungry").textContent = t.hungry;
    document.getElementById("copy").textContent = t.copy;
    document.getElementById("t-address").textContent = t.address;
    document.getElementById("t-fine").textContent = t.fine;
    document.getElementById("tabs").innerHTML = MENU.map(function (s) {
      return '<a class="tab" href="#' + s.id + '" data-id="' + s.id + '">' + svg(s.icon) + s.title[lang] + "</a>";
    }).join("");
    document.getElementById("menu").innerHTML = MENU.map(function (s) { return sectionHTML(s, t); }).join("");
    filter();
    spy();
  }

  function setActive(id) {
    var tabs = document.querySelectorAll(".tab");
    tabs.forEach(function (a) {
      var on = a.dataset.id === id;
      a.setAttribute("aria-current", on ? "true" : "false");
      if (on) { var bar = a.parentNode; var x = a.offsetLeft - bar.clientWidth / 2 + a.clientWidth / 2; bar.scrollTo({ left: x, behavior: "smooth" }); }
    });
  }
  function spy() {
    var secs = Array.prototype.slice.call(document.querySelectorAll(".sec")).filter(function (s) { return !s.hidden; });
    var cur = secs[0] && secs[0].id;
    secs.forEach(function (s) { if (s.getBoundingClientRect().top < 140) cur = s.id; });
    if (cur && cur !== spy.last) { spy.last = cur; setActive(cur); }
  }
  var ticking = false;
  window.addEventListener("scroll", function () { if (!ticking) { ticking = true; requestAnimationFrame(function () { ticking = false; spy(); }); } }, { passive: true });

  function filter() {
    var q = document.getElementById("q").value.trim().toLowerCase();
    var any = false;
    document.querySelectorAll(".sec").forEach(function (sec) {
      var hits = 0;
      sec.querySelectorAll("[data-hay]").forEach(function (n) {
        var m = !q || n.dataset.hay.indexOf(q) > -1 || (q === "حراق" && n.dataset.hay.indexOf("spicy") > -1);
        n.hidden = !m; if (m) hits++;
      });
      var titleHit = q && sec.querySelector("h2").textContent.toLowerCase().indexOf(q) > -1;
      if (titleHit) { sec.querySelectorAll("[data-hay]").forEach(function (n) { n.hidden = false; }); hits = 1; }
      sec.hidden = hits === 0; if (hits) any = true;
    });
    document.getElementById("empty").hidden = any;
    spy.last = null;
  }
  document.getElementById("q").addEventListener("input", function () { filter(); spy(); });

  document.querySelector(".lang").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem("enzo-lang", lang); } catch (err) {}
    render();
  });

  document.getElementById("copy").addEventListener("click", function () {
    var btn = this, t = T[lang];
    function done() { btn.textContent = t.copied; setTimeout(function () { btn.textContent = t.copy; }, 1600); }
    function fallback() { var r = document.createRange(); r.selectNodeContents(document.getElementById("phone")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText("01043540040").then(done, fallback); else fallback();
  });

  render();
  if (hashOnLoad && document.getElementById(hashOnLoad)) { document.getElementById(hashOnLoad).scrollIntoView(); }
})();
</script>
