<title>Enzo Saloon Menu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Zilla+Slab:wght@500;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@500;800&display=swap">
<style>
/* Palette: ranch green + chili red on parchment, gold only for nails and stars. Layout: one parchment column (max 720px) like a saloon bill of fare — wanted-poster header, wooden plank section signs, items printed straight on the paper with dotted price leaders, cut-out burgers with no background */
:root {
  --paper: #f3e6cc; --paper-2: #e9d5ad; --green: #1f4a32; --on-wood: #f7ecd6;
  --red: #a51f1b; --red-text: #a51f1b; --green-text: #2a6b45; --gold: #d99a2b; --on-gold: #231a14;
  --ink: #231a14; --ink-muted: #6a5442; --rope: #b08a5a; --focus: #1e5aa8; --floor: rgba(20, 14, 10, 0.45);
  --font-display: Rye, "Alfa Slab One", Georgia, serif;
  --font-slab: "Zilla Slab", Rockwell, Georgia, serif;
  --font-body: Lora, Georgia, "Times New Roman", serif;
  --font-ar-display: "Reem Kufi", Tajawal, sans-serif;
  --font-ar-body: Tajawal, system-ui, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1b130e; --paper-2: #261a13; --green: #2a5a3e; --red: #b82a24; --red-text: #ef6b5a; --green-text: #6fbf8c; --gold: #e8b04a;
  --ink: #f3e6cc; --ink-muted: #c4ab8c; --rope: #6b5039; --focus: #7fb0f0; --floor: rgba(0, 0, 0, 0.85); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #1b130e; --paper-2: #261a13; --green: #2a5a3e; --red: #b82a24; --red-text: #ef6b5a; --green-text: #6fbf8c; --gold: #e8b04a;
  --ink: #f3e6cc; --ink-muted: #c4ab8c; --rope: #6b5039; --focus: #7fb0f0; --floor: rgba(0, 0, 0, 0.85); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--green); }
body.ar { font-family: var(--font-ar-body); }
.wrap { max-width: 720px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.draft { background: var(--red); color: var(--on-wood); font-family: var(--font-slab); font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.draft .wrap { padding-block: 6px; text-align: center; }
body.ar .draft { font-family: var(--font-ar-body); letter-spacing: 0; text-transform: none; }

/* Wanted-poster header */
.hero .wrap { padding-block: 20px 8px; }
.poster { position: relative; padding: 20px 16px 18px; text-align: center; border: 3px solid var(--green); outline: 1.5px solid var(--green); outline-offset: -9px; background: var(--paper-2); }
.lang { position: absolute; top: 14px; inset-inline-end: 14px; display: inline-flex; border: 2px solid var(--green); border-radius: 999px; overflow: hidden; background: var(--paper); }
.lang button { min-width: 40px; min-height: 34px; padding: 0 10px; border: 0; background: transparent; color: var(--ink); font-family: var(--font-slab); font-weight: 700; font-size: 14px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--green); color: var(--on-wood); }
.lang button.arb { font-family: var(--font-ar-body); font-weight: 800; }
.crest { width: 96px; height: auto; display: block; margin: 0 auto; }
.eyebrow { margin-top: 10px; font-family: var(--font-slab); font-weight: 700; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--red-text); }
body.ar .eyebrow { font-family: var(--font-ar-body); letter-spacing: 0; font-size: 15px; }
.hero h1 { margin: 4px 0 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 8vw, 50px); line-height: 1.05; text-wrap: balance; color: var(--ink); }
body.ar .hero h1 { font-family: var(--font-ar-display); font-weight: 700; line-height: 1.4; }
.hero-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; margin-top: 10px; font-family: var(--font-slab); font-weight: 700; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted); }
body.ar .hero-meta { font-family: var(--font-ar-body); letter-spacing: 0; text-transform: none; font-size: 15px; }
.stars { color: var(--gold); }
.checker { height: 10px; margin-top: 16px; background: repeating-linear-gradient(135deg, var(--rope) 0 6px, transparent 6px 12px); border-block: 1.5px solid var(--rope); }

/* Chapter: a torn ticket */
.chapter { margin-top: 18px; display: flex; gap: 14px; align-items: center; padding: 12px 0; border-block: 2px dashed var(--rope); }
.chapter img { width: 72px; height: 72px; object-fit: cover; border-radius: 50%; border: 3px solid var(--red); flex: none; }
.chapter > div { min-width: 0; }
.chapter .k { font-family: var(--font-slab); font-weight: 700; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--green-text); }
.chapter h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.2; }
.chapter p { margin: 2px 0 0; font-style: italic; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
body.ar .chapter .k { font-family: var(--font-ar-body); letter-spacing: 0; font-size: 13px; }
body.ar .chapter h2 { font-family: var(--font-ar-display); }
body.ar .chapter p { font-style: normal; font-size: 15px; line-height: 24px; }

/* Tabs: brass tags on a leather strap */
.tabs-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--green); margin-top: 18px; box-shadow: 0 3px 0 var(--rope); }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-block: 8px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 4px; color: var(--on-wood); font-family: var(--font-slab); font-weight: 700; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; }
.tab svg { width: 18px; height: 18px; flex: none; }
.tab[aria-current="true"] { background: var(--red); color: var(--on-wood); box-shadow: 2px 2px 0 rgba(0,0,0,.35); }
body.ar .tab { font-family: var(--font-ar-body); font-weight: 800; letter-spacing: 0; text-transform: none; }

.search { margin-top: 18px; display: flex; align-items: center; gap: 8px; min-height: 46px; border-bottom: 2px solid var(--ink); }
.search svg { width: 20px; height: 20px; flex: none; color: var(--ink-muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16px; font-style: italic; padding-block: 10px; outline: none; }
body.ar .search input { font-style: normal; }
.search input::placeholder { color: var(--ink-muted); }
.search:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.empty { margin-top: 24px; text-align: center; font-style: italic; color: var(--ink-muted); }

/* Sections: wooden plank signs */
main { padding-bottom: 40px; }
.sec { padding-top: 40px; scroll-margin-top: 72px; }
.sec-head { position: relative; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 2px 14px; padding: 12px 28px; text-align: center; color: var(--on-wood);
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 2px, transparent 2px 9px), linear-gradient(var(--green), var(--green)); border-radius: 3px; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
.sec-head::before, .sec-head::after { content: ""; position: absolute; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--gold); box-shadow: inset -1px -1px 0 rgba(0,0,0,.4); }
.sec-head::before { left: 10px; } .sec-head::after { right: 10px; }
.sec-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.15; }
body.ar .sec-head h2 { font-family: var(--font-ar-display); font-weight: 700; line-height: 1.5; }
.sec-head .kick { flex-basis: 100%; font-family: var(--font-slab); font-weight: 700; font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
body.ar .sec-head .kick { font-family: var(--font-ar-body); letter-spacing: 0; font-size: 14px; }
.sec-head .note { display: none; }
.withfries { margin: 10px 0 0; text-align: center; font-family: var(--font-slab); font-weight: 700; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--green-text); }
body.ar .withfries { font-family: var(--font-ar-body); letter-spacing: 0; font-size: 14px; }
.aside { margin: 12px 0 0; text-align: center; font-style: italic; font-size: 18px; color: var(--red-text); }
body.ar .aside { font-style: normal; font-family: var(--font-ar-display); }
.items { display: grid; margin-top: 8px; }

/* Item: printed on the paper, no box */
.item { padding-block: 14px; border-bottom: 1px dashed var(--rope); }
.item.photo { display: grid; grid-template-columns: 1fr 132px; gap: 0 12px; align-items: center; }
.item.photo .body { min-width: 0; }
.cutwrap { position: relative; display: block; width: 132px; padding-bottom: 10px; }
.cutwrap::after { content: ""; position: absolute; left: 10%; right: 10%; bottom: 2px; height: 16px; border-radius: 50%; background: radial-gradient(closest-side, var(--floor), transparent); z-index: 0; }
.cut { position: relative; z-index: 1; width: 100%; height: auto; display: block; }
.line { display: flex; align-items: baseline; gap: 8px; }
.item h3 { margin: 0; overflow-wrap: anywhere; font-family: var(--font-slab); font-weight: 700; font-size: 21px; line-height: 26px; letter-spacing: .03em; text-transform: uppercase; min-width: 0; }
body.ar .item h3 { font-family: var(--font-ar-body); font-weight: 800; font-size: 20px; letter-spacing: 0; text-transform: none; }
.lead { flex: 1; min-width: 16px; border-bottom: 2px dotted var(--ink-muted); transform: translateY(-5px); }
.prices { display: flex; align-items: baseline; gap: 6px; flex: none; font-family: var(--font-slab); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; color: var(--red-text); }
.prices small { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-muted); margin-inline-end: 2px; }
body.ar .prices small { font-family: var(--font-ar-body); letter-spacing: 0; font-size: 12px; }
.prices .sep { color: var(--ink-muted); font-weight: 500; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-slab); font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.badge svg { width: 13px; height: 13px; }
body.ar .badge { font-family: var(--font-ar-body); letter-spacing: 0; font-weight: 800; }
.b-signature { color: var(--red-text); } .b-spicy { color: var(--red-text); } .b-grilled { color: var(--green-text); } .b-tortilla { color: var(--ink-muted); }
.desc { margin: 4px 0 0; font-style: italic; font-size: 15px; line-height: 22px; color: var(--ink-muted); }
body.ar .desc { font-style: normal; font-size: 15px; line-height: 26px; font-weight: 500; }
@media (max-width: 440px) { .item.photo { grid-template-columns: 1fr 104px; } .cutwrap { width: 104px; } .item h3 { font-size: 19px; } }

.sizes { display: flex; justify-content: center; gap: 28px; margin-top: 16px; text-align: center; }
.size .l { font-family: var(--font-slab); font-weight: 700; font-size: 14px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-muted); }
body.ar .size .l { font-family: var(--font-ar-body); letter-spacing: 0; }
.size .n { font-family: var(--font-display); font-size: 38px; line-height: 1.1; color: var(--red-text); }
.sauces { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 0; margin-top: 8px; }
.sauce { font-family: var(--font-slab); font-weight: 700; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
.sauce + .sauce::before { content: "★"; color: var(--gold); margin: 0 10px; }
body.ar .sauce { font-family: var(--font-ar-body); letter-spacing: 0; font-weight: 800; }
.sub { margin: 22px 0 0; text-align: center; font-family: var(--font-slab); font-weight: 700; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--green-text); }
body.ar .sub { font-family: var(--font-ar-body); letter-spacing: 0; }

footer { background: var(--green); color: var(--on-wood); border-top: 4px double var(--rope); }
footer .wrap { padding-block: 28px 36px; display: grid; gap: 14px; text-align: center; justify-items: center; }
footer .big { font-family: var(--font-display); font-size: 26px; line-height: 1.2; }
body.ar footer .big { font-family: var(--font-ar-display); font-weight: 700; }
.phone { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; }
.phone strong { font-family: var(--font-slab); font-weight: 700; font-size: 28px; letter-spacing: .06em; font-variant-numeric: tabular-nums; direction: ltr; user-select: all; }
.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border: 0; border-radius: 4px; background: var(--gold); color: var(--on-gold); font-family: var(--font-slab); font-weight: 700; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
body.ar .btn { font-family: var(--font-ar-body); letter-spacing: 0; font-weight: 800; }
.foot-meta { display: grid; gap: 4px; font-size: 15px; }
.foot-meta a { color: var(--on-wood); }
.fine { font-size: 13px; font-style: italic; opacity: .85; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function priceHTML(it, t) {
    if (it.p != null) return '<span class="prices">' + it.p + "</span>";
    return '<span class="prices" aria-label="' + t.single + " " + it.s + ", " + t.double + " " + it.d + '">' +
      it.s + '<span class="sep">/</span>' + it.d + "</span>";
  }
  function itemHTML(it, t) {
    var badges = (it.b || []).map(function (b) {
      return '<span class="badge b-' + b + '">' + (b === "spicy" ? svg("spicy") : "") + BADGE[b][lang] + "</span>";
    }).join("");
    var name = it[lang];
    var hay = (it.en + " " + it.ar + " " + it.den + " " + it.dar + " " + (it.b || []).join(" ")).toLowerCase();
    var body = '<div class="line"><h3>' + esc(name) + '</h3><span class="lead" aria-hidden="true"></span>' + priceHTML(it, t) + "</div>" +
      (badges ? '<div class="tags">' + badges + "</div>" : "") +
      '<p class="desc">' + esc(lang === "ar" ? it.dar : it.den) + "</p>";
    if (it.img) return '<article class="item photo" data-hay="' + esc(hay) + '"><div class="body">' + body + '</div><span class="cutwrap"><img class="cut" src="' + IMG[it.img] + '" alt="' + esc(name) + '" loading="lazy"></span></article>';
    return '<article class="item" data-hay="' + esc(hay) + '">' + body + "</article>";
  }
  function sectionHTML(sec, t) {
    var h = '<section class="sec" id="' + sec.id + '" aria-labelledby="h-' + sec.id + '">' +
      '<div class="sec-head"><h2 id="h-' + sec.id + '">' + sec.title[lang] + "</h2>" +
      '<span class="kick">' + sec.kick[lang] + "</span>" +
      "</div>" + (sec.fries ? '<p class="withfries">★ ' + t.withFries + " · " + t.single + " / " + t.double + " ★</p>" : "");
    if (sec.aside) h += '<p class="aside">' + sec.aside[lang] + "</p>";
    if (sec.kind === "fries") {
      h += '<div class="sizes" data-hay="fries french بطاطس فرايز"><div class="size"><div class="l">' + t.medium + '</div><div class="n">25</div></div>' +
        '<div class="size"><div class="l">' + t.large + '</div><div class="n">50</div></div></div>';
    } else if (sec.kind === "extras") {
      h += '<div class="items"><article class="item" data-hay="soda drink مشروب غازي"><div class="line"><h3>' + t.soda + '</h3><span class="lead" aria-hidden="true"></span><span class="prices">25</span></div></article></div>' +
        '<p class="sub">' + t.sauces + '</p><div class="sauces" data-hay="sauce صوص ' + SAUCES.map(function (s) { return s.join(" ").toLowerCase(); }).join(" ") + '">' +
        SAUCES.map(function (s) { return '<span class="sauce">' + (lang === "ar" ? s[1] : s[0]) + "</span>"; }).join("") + "</div>";
    } else {
      h += '<div class="items">' + sec.items.map(function (it) { return itemHTML(it, t); }).join("") + "</div>";
    }
    return h + "</section>";
  }

  function render() {
    var t = T[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.body.classList.toggle("ar", lang === "ar");
    ["en", "ar"].forEach(function (l) { document.getElementById("lang-" + l).setAttribute("aria-pressed", l === lang ? "true" : "false"); });
    document.getElementById("draft").textContent = t.draft;
    document.getElementById("t-eyebrow").textContent = t.eyebrow;
    document.getElementById("t-tagline").textContent = t.tagline;
    document.getElementById("t-meta").innerHTML = t.meta;
    document.getElementById("t-journey").textContent = t.journey;
    document.getElementById("t-chapter").textContent = t.chapter;
    document.getElementById("t-story").textContent = t.story;
    document.getElementById("q").placeholder = t.search;
    document.getElementById("q").setAttribute("aria-label", t.search);
    document.getElementById("empty").textContent = t.empty;
    document.getElementById("t-hungry").textContent = t.hungry;
    document.getElementById("copy").textContent = t.copy;
    document.getElementById("t-address").textContent = t.address;
    document.getElementById("t-fine").textContent = t.fine;
    document.getElementById("tabs").innerHTML = MENU.map(function (s) {
      return '<a class="tab" href="#' + s.id + '" data-id="' + s.id + '">' + svg(s.icon) + s.title[lang] + "</a>";
    }).join("");
    document.getElementById("menu").innerHTML = MENU.map(function (s) { return sectionHTML(s, t); }).join("");
    filter();
    spy();
  }

  function setActive(id) {
    var tabs = document.querySelectorAll(".tab");
    tabs.forEach(function (a) {
      var on = a.dataset.id === id;
      a.setAttribute("aria-current", on ? "true" : "false");
      if (on) { var bar = a.parentNode; var x = a.offsetLeft - bar.clientWidth / 2 + a.clientWidth / 2; bar.scrollTo({ left: x, behavior: "smooth" }); }
    });
  }
  function spy() {
    var secs = Array.prototype.slice.call(document.querySelectorAll(".sec")).filter(function (s) { return !s.hidden; });
    var cur = secs[0] && secs[0].id;
    secs.forEach(function (s) { if (s.getBoundingClientRect().top < 140) cur = s.id; });
    if (cur && cur !== spy.last) { spy.last = cur; setActive(cur); }
  }
  var ticking = false;
  window.addEventListener("scroll", function () { if (!ticking) { ticking = true; requestAnimationFrame(function () { ticking = false; spy(); }); } }, { passive: true });

  function filter() {
    var q = document.getElementById("q").value.trim().toLowerCase();
    var any = false;
    document.querySelectorAll(".sec").forEach(function (sec) {
      var hits = 0;
      sec.querySelectorAll("[data-hay]").forEach(function (n) {
        var m = !q || n.dataset.hay.indexOf(q) > -1 || (q === "حراق" && n.dataset.hay.indexOf("spicy") > -1);
        n.hidden = !m; if (m) hits++;
      });
      var titleHit = q && sec.querySelector("h2").textContent.toLowerCase().indexOf(q) > -1;
      if (titleHit) { sec.querySelectorAll("[data-hay]").forEach(function (n) { n.hidden = false; }); hits = 1; }
      sec.hidden = hits === 0; if (hits) any = true;
    });
    document.getElementById("empty").hidden = any;
    spy.last = null;
  }
  document.getElementById("q").addEventListener("input", function () { filter(); spy(); });

  document.querySelector(".lang").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem("enzo-lang", lang); } catch (err) {}
    render();
  });

  document.getElementById("copy").addEventListener("click", function () {
    var btn = this, t = T[lang];
    function done() { btn.textContent = t.copied; setTimeout(function () { btn.textContent = t.copy; }, 1600); }
    function fallback() { var r = document.createRange(); r.selectNodeContents(document.getElementById("phone")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText("01043540040").then(done, fallback); else fallback();
  });

  render();
  if (hashOnLoad && document.getElementById(hashOnLoad)) { document.getElementById(hashOnLoad).scrollIntoView(); }
})();
</script>
