<svg xmlns="http://www.w3.org/2000/svg" width="890" height="447" viewBox="0 0 890 447" font-family="Arial, Helvetica, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="890" height="447" rx="10" fill="#f4f4f2"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Input nodes -->
  <circle cx="130" cy="85"  r="33" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="130" cy="195" r="33" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="130" cy="330" r="33" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="124" y="93"  font-size="26" font-weight="bold" fill="#1a1a1a" text-anchor="middle">X<tspan dy="6" font-size="17">1</tspan></text>
  <text x="124" y="203" font-size="26" font-weight="bold" fill="#1a1a1a" text-anchor="middle">X<tspan dy="6" font-size="17">2</tspan></text>
  <text x="124" y="338" font-size="26" font-weight="bold" fill="#1a1a1a" text-anchor="middle">X<tspan dy="6" font-size="17">n</tspan></text>

  <!-- Dashed line between X2 and Xn -->
  <line x1="130" y1="232" x2="130" y2="293" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- Labels: Inputs / Weights -->
  <text x="130" y="405" font-size="19" fill="#444444" text-anchor="middle">Inputs</text>
  <text x="215" y="352" font-size="19" fill="#444444">Weights</text>

  <!-- Weighted connections to summing junction -->
  <line x1="160" y1="98"  x2="352" y2="228" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="163" y1="199" x2="350" y2="237" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="161" y1="317" x2="352" y2="253" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Weight labels -->
  <text x="212" y="128" font-size="19" font-weight="bold" fill="#1a1a1a">w<tspan dy="5" font-size="13">1</tspan></text>
  <text x="212" y="192" font-size="19" font-weight="bold" fill="#1a1a1a">w<tspan dy="5" font-size="13">2</tspan></text>
  <text x="220" y="277" font-size="19" font-weight="bold" fill="#1a1a1a">w<tspan dy="5" font-size="13">n</tspan></text>

  <!-- Bias -->
  <text x="390" y="48" font-size="20" fill="#444444" text-anchor="middle">Bias</text>
  <text x="390" y="76" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">bo</text>
  <line x1="390" y1="90" x2="390" y2="195" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Summing junction -->
  <circle cx="390" cy="240" r="42" fill="#c8e6c4" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="390" y="254" font-size="38" fill="#1a1a1a" text-anchor="middle">&#931;</text>
  <text x="390" y="320" font-size="20" fill="#333333" text-anchor="middle">Summing</text>
  <text x="390" y="345" font-size="20" fill="#333333" text-anchor="middle">Junction</text>

  <!-- Yin arrow -->
  <line x1="432" y1="240" x2="548" y2="240" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="488" y="230" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Yin</text>

  <!-- Activation function -->
  <circle cx="595" cy="240" r="42" fill="#c8e6c4" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="595" y="251" font-size="30" fill="#1a1a1a" text-anchor="middle">F</text>
  <text x="595" y="320" font-size="20" fill="#333333" text-anchor="middle">Activation</text>
  <text x="595" y="345" font-size="20" fill="#333333" text-anchor="middle">Function</text>

  <!-- Output -->
  <line x1="637" y1="240" x2="740" y2="240" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="758" y="248" font-size="22" font-weight="bold" fill="#1a1a1a">y</text>
  <text x="765" y="172" font-size="20" fill="#444444" text-anchor="middle">Output</text>
</svg>
